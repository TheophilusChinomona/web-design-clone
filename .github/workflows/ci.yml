name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck & API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: Production Build
        run: npm run build

      - name: Generate OpenAPI Specs & SDKs
        run: |
          npm run openapi:generate
          node plugins/website-cloner/skills/convert-to-webapp/scripts/generate-sdk.mjs

      - name: Start Production Server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for Server Ready
        run: npx wait-on http://localhost:3000 -t 30000

      - name: Run OpenAPI Endpoint Tests
        run: npm run openapi:test

      - name: Run Client SDK Integration Tests
        run: node scripts/test-sdk.mjs
